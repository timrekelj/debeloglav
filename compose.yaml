services:
  debeloglav:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/debeloglav.db
    volumes:
      - ./data:/app/data  # memories, tasks and the style guide survive rebuilds
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
