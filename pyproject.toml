[project]
name = "debeloglav"
version = "0.1.0"
description = "Debeloglav: a Discord bot that answers when tagged, like @grok, with web research by Mistral Large 4"
requires-python = ">=3.12,<3.15"
dependencies = [
    "croniter>=6.2.4",
    "discord-py>=2.7.1",
    "mistralai-agents>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
asyncio_mode = "auto"
