name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      # Only tests are lint-checked: debeloglav/ has pre-existing ruff findings
      # that are tracked separately.
      - run: uv run --with ruff ruff check tests
      - run: uv run pytest -q
